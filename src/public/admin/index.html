<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atithy Workers</title>
    <link rel="stylesheet" href="/admin/assets/dashboard.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Atithy Worker Onboarding</h1>
        <p>WhatsApp Aadhaar verification dashboard</p>
      </div>
      <form method="post" action="/admin/logout">
        <button class="ghost" type="submit">Logout</button>
      </form>
    </header>
    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Workers</h2>
          <button id="refreshBtn" class="ghost">Refresh</button>
        </div>
        <div id="workers" class="worker-list"></div>
      </section>
      <section class="panel detail-panel">
        <div id="details" class="empty">Select a worker to review Aadhaar status.</div>
      </section>
    </main>
    <script src="/admin/assets/dashboard.js"></script>
  </body>
</html>
