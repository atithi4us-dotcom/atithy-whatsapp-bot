<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atithy Workers</title>
    <link rel="stylesheet" href="/admin/assets/dashboard.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Atithy Worker Onboarding</h1>
        <p>WhatsApp worker onboarding dashboard</p>
      </div>
      <form method="post" action="/admin/logout">
        <button class="ghost" type="submit">Logout</button>
      </form>
    </header>
    <main class="dashboard-shell">
      <section id="dashboardStats" class="stats-grid" aria-label="Dashboard summary"></section>
      <div class="layout">
        <section class="panel workers-panel">
          <div class="panel-head">
            <h2>Workers</h2>
            <button id="refreshBtn" class="ghost">Refresh</button>
          </div>
          <div id="workers" class="worker-list"></div>
          <div class="pagination-bar" aria-label="Workers pagination">
            <button id="prevWorkersBtn" class="ghost" type="button">Previous</button>
            <span id="workersPageLabel">Page 1</span>
            <button id="nextWorkersBtn" class="ghost" type="button">Next</button>
          </div>
        </section>
        <section class="panel detail-panel">
          <div id="details" class="empty">Select a worker to review onboarding status.</div>
        </section>
      </div>
    </main>
    <script src="/admin/assets/dashboard.js"></script>
  </body>
</html>
